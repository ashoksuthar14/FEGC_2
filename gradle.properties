# This machine has ~6 GB of RAM. These values are deliberately small: an earlier
# -Xmx4096m crashed the daemon with "insufficient memory ... failed to map" rather
# than an OutOfMemoryError, which is the signature of the OS running out, not the heap.
# Same ~2.8 GB total as before, reallocated. The Gradle daemon is nearly idle while Kotlin
# compiles and never needed 1.5 GB for a single-module project; the Kotlin daemon is the one
# doing the work, and on a full (non-incremental) compile with the Compose plugin it dies at
# 1.0-1.3 GB -- "OutOfMemoryError: Java heap space ... Done with result 137" in
# %TEMP%\kotlin-daemon.*.log after minutes of GC thrash. Those were the 15-minute builds.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.java.home=C:/Program Files/Java/jdk-21
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
