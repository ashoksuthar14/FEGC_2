# This machine has ~6 GB of RAM. These values are deliberately small: an earlier
# -Xmx4096m crashed the daemon with "insufficient memory ... failed to map" rather
# than an OutOfMemoryError, which is the signature of the OS running out, not the heap.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.java.home=C:/Program Files/Java/jdk-21
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
